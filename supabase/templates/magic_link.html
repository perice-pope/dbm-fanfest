<h2 style="font-family:Arial,sans-serif">Your sign-in code</h2>
<p style="font-family:Arial,sans-serif;font-size:34px;letter-spacing:8px;margin:16px 0"><strong>{{ .Token }}</strong></p>
<p style="font-family:Arial,sans-serif">Type it on the page you came from. On a computer you can also <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">open this link</a>.</p>
<p style="font-family:Arial,sans-serif;color:#666">The code expires in 10 minutes. If you did not ask for it, ignore this email.</p>
