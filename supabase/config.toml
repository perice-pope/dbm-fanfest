# Pushed with `supabase config push` (auth settings only). Database changes live in supabase/migrations.
project_id = "dbm-fanfest"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "https://*.vercel.app/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

# Custom email templates (the 6-digit code) need custom SMTP or a paid Supabase plan.
# Once SMTP is set (see README), uncomment these and run `supabase config push` again.
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "hello@your-band-domain.com"
# sender_name = "Destroyed by Moths"
# [auth.email.template.magic_link]
# subject = "Your Destroyed by Moths sign-in code"
# content_path = "./supabase/templates/magic_link.html"
# [auth.email.template.confirmation]
